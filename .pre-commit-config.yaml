repos:
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
    - id: fmt
    - id: cargo-check
    - id: clippy
      args: ['--all-targets', '--all-features', '--', '-D', 'warnings']

  - repo: https://github.com/nicklockwood/SwiftFormat
    rev: 0.58.7
    hooks:
      - id: swiftformat
        args: ['--swiftversion', '5.9']

  - repo: https://github.com/realm/SwiftLint
    rev: 0.62.2
    hooks:
      - id: swiftlint
        args: ['--strict']

  - repo: local
    hooks:
      - id: swift-test
        name: Swift Tests
        entry: bash -c 'cd macos-launcher && swift test'
        language: system
        types: [swift]
        pass_filenames: false
