[package]
name = "bee-core"
version = { workspace = true }
edition = "2024"

[dependencies]
migration = { path = "../migration" }

all_asserts.workspace = true
chrono.workspace = true
env_logger.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
uuid.workspace = true
strum.workspace = true
thiserror.workspace = true

toml.workspace = true

# Make it easier for global static data
once_cell = "1.17"

# Used to expand shell-specific symbols such as ~
shellexpand = "3.1"

# Easily Serialise / deserialise `&dyn Type` objects
typetag = "0.2"



# Use SQLx 0.7 to match SeaORM
# sqlx = { version = "^0.8", features = ["sqlite", "runtime-tokio-native-tls", "macros"] }

# SeaORM 0.12 uses SQLx 0.7 internally
sea-orm = { version = "^1.1.0", features = ["sqlx-sqlite", "runtime-tokio-native-tls", "macros"] }
sea-orm-migration = { version = "^1.1.0", features = ["sqlx-sqlite", "runtime-tokio-native-tls"] }

# Tokio runtime for async support
tokio = { version = "1", features = ["full"] }
