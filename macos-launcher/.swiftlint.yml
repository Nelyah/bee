included:
  - Sources
  - Tests

excluded:
  - .build
  - DerivedData
  - .swiftpm

line_length:
  warning: 150
  error: 200

type_body_length:
  warning: 520  # Temporarily increased during DetailEditingState migration
  error: 800

file_length:
  warning: 800
  error: 1200

function_body_length:
  warning: 100
  error: 150

cyclomatic_complexity:
  warning: 15
  error: 25

disabled_rules:
  - trailing_comma
  - identifier_name
  - force_unwrapping
  - implicitly_unwrapped_optional
  - large_tuple
  - opening_brace
  - for_where
  - multiple_closures_with_trailing_closure
  - unneeded_synthesized_initializer
  - static_over_final_class
  - non_optional_string_data_conversion
  - unused_enumerated
